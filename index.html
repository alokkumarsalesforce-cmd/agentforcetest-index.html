<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google Page</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      background-color: #f8f9fa;
    }
    header {
      background-color: #ffffff;
      padding: 12px 24px;
      border-bottom: 1px solid #dadce0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 1.1rem;
      color: #202124;
    }
    header a {
      color: #1a73e8;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
    }
    header a:hover {
      text-decoration: underline;
    }
    iframe {
      width: 100%;
      flex: 1;
      border: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Google Search View</h1>
    <a href="https://www.google.com" target="_blank" rel="noopener noreferrer">Open Google.com ↗</a>
  </header>
  <iframe src="https://www.google.com/search?igu=1" title="Google Search"></iframe>
</body>
</html>
